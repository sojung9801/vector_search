[project]
name = "videofinder"
version = "0.1.0"
description = "영상찾기 — 단일 영상 로컬 멀티모달 검색 (발화·화면·몸짓)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "mlx>=0.20",
    "mlx-whisper>=0.4",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.45",
    "sentencepiece>=0.2",
    "huggingface-hub>=0.23",
    "pillow>=10.0",
    "imagehash>=4.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sherpa-onnx>=1.10",
    "psutil>=5.9",
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "sherpa-onnx-core==1.13.8",
    "httpx>=0.27",
    "torchvision>=0.29.1",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest>=8.0", "static-ffmpeg>=2.7"]

[project.scripts]
vf-index = "videofinder.cli.index_runner:main"
vf-search = "videofinder.cli.search_cli:main"
vf-eval = "videofinder.cli.evaluate:main"
vf-models = "videofinder.cli.models_cli:main"
vf-playback = "videofinder.cli.playback_backfill:main"
vf-people = "videofinder.cli.people_index:main"
vf-person = "videofinder.cli.person_cli:main"
vf-judge = "videofinder.cli.judge_eval:main"
vf-caption = "videofinder.cli.caption_index:main"
vf-bench-search = "videofinder.cli.bench_search:main"
vf-calibrate-speech = "videofinder.cli.calibrate_speech:main"
vf-server = "videofinder.app.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videofinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 실제 모델·영상 사용 (느림)"]
addopts = "-q -m 'not integration'"
